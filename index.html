<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACEM core team contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo:#1D2B64;
    --marigold:#F2B632;
    --mist:#EEF1F8;
    --slate:#4A5578;
    --line:#D3D9EA;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--mist);color:var(--indigo);
    font-family:"Instrument Sans",system-ui,sans-serif;font-size:17px;line-height:1.5;
  }
  main{max-width:480px;margin:0 auto;padding:20px 18px 56px}
  h1,h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0}
  h1{font-size:1.5rem;font-weight:800;margin-bottom:2px}
  .sub{margin:0 0 14px;color:var(--slate);font-size:.95rem}
  .foot{margin:40px 0 0;text-align:center;color:var(--slate);font-weight:600}
  h2{font-size:1.2rem;font-weight:800;margin-bottom:8px}

  .card-wrap{border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(29,43,100,.18);background:#fff;aspect-ratio:4/5}
  .card-wrap img{display:block;width:100%;height:auto}
  .hint{color:var(--slate);font-size:.9rem;margin:10px 2px 0}

  .btn{
    display:block;width:100%;border:0;border-radius:14px;padding:16px 18px;margin-top:14px;
    font:600 1.05rem "Instrument Sans",system-ui,sans-serif;text-align:center;cursor:pointer;text-decoration:none;
    background:var(--marigold);color:var(--indigo);
  }
  .btn:focus-visible,a:focus-visible{outline:3px solid var(--indigo);outline-offset:3px}
  .btn.secondary{background:transparent;border:2px solid var(--indigo)}

  section{margin-top:38px}
  .person + .person{margin-top:22px}
  .person h3{margin:0 0 4px;font:800 1.05rem "Bricolage Grotesque",system-ui,sans-serif}
  .person p{margin:0 0 6px;color:var(--slate);font-size:.95rem}
  .links a{
    display:flex;justify-content:space-between;padding:13px 2px;border-top:1px solid var(--line);
    color:var(--indigo);text-decoration:none;font-weight:500;
  }
  .links a:last-child{border-bottom:1px solid var(--line)}
  .links span{color:var(--slate);font-weight:400;font-size:.92rem}

  .meetup{border-left:6px solid var(--marigold);padding:2px 0 2px 16px}
  .meetup p{margin:2px 0}
  .meetup .when{font-weight:600}
  .meetup .note{color:var(--slate);margin-top:8px}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--indigo);color:#fff;
    padding:12px 18px;border-radius:12px;font-size:.95rem;opacity:0;pointer-events:none;transition:opacity .2s}
  #toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<main>
  <h1 id="pageTitle">ACEM core team</h1>
  <p class="sub" id="fullName"></p>

  <div class="card-wrap"><img id="cardImg" alt="Contact card with names, phone numbers and emails of the ACEM core team"></div>
  <button class="btn" id="saveBtn" type="button">Save card to your phone</button>
  <p class="hint">On some phones you can also press and hold the card and choose Save Image.</p>

  <section>
    <h2>Message us</h2>
    <div id="people"></div>
  </section>

  <section>
    <h2>Next meetup</h2>
    <div class="meetup" id="meetup"></div>
    <a class="btn secondary" id="calBtn" href="#" download="acem-meetup.ics">Add to calendar</a>
  </section>
  <p class="foot" id="websiteNote"></p>
</main>
<div id="toast" role="status" aria-live="polite"></div>

    i.onload = () => res(i);
    i.onerror = () => res(null);
    i.src = src;
  });
}
const initials = n => n.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();

function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }

function fit(ctx,text,maxW){
  if(ctx.measureText(text).width <= maxW) return text;
  while(text.length>1 && ctx.measureText(text+"…").width > maxW) text = text.slice(0,-1);
  return text+"…";
}

async function drawCard(){
  try{
    await Promise.all([
      document.fonts.load(`800 60px ${DISPLAY}`),
      document.fonts.load(`600 34px ${BODY}`),
      document.fonts.load(`400 30px ${BODY}`)
    ]);
  }catch(e){}

  const W=1080, H=1350;
  const cv = document.createElement("canvas");
  cv.width=W; cv.height=H;
  const ctx = cv.getContext("2d");

  // background
  ctx.fillStyle = C.mist; ctx.fillRect(0,0,W,H);

  // header: white band for the logo, indigo strip for team + office
  ctx.fillStyle = C.white; ctx.fillRect(0,0,W,222);
  ctx.fillStyle = C.indigo; ctx.fillRect(0,222,W,62);
  ctx.fillStyle = C.marigold; ctx.fillRect(0,284,W,10);

  const logo = await loadImage(CONFIG.org.logo);
  if(logo){
    const lw = 840, lh = lw*logo.height/logo.width;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(logo, (W-lw)/2, (222-lh)/2, lw, lh);
  }else{
    ctx.fillStyle = C.indigo; ctx.font = `800 96px ${DISPLAY}`;
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(CONFIG.org.name, W/2, 111);
  }
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillStyle = C.marigold; ctx.font = `600 36px ${BODY}`;
  ctx.fillText(`${CONFIG.org.subtitle}  |  ${CONFIG.meetup.office.replace("ACEM Core office: ","Office: ")}`, W/2, 255);
  ctx.textAlign="left"; ctx.textBaseline="alphabetic";

  // people panels
  const photos = await Promise.all(CONFIG.people.map(p => loadImage(p.photo)));
  CONFIG.people.slice(0,2).forEach((p,i)=>{
    const y = 335 + i*330, h = 300, x = 50, w = W-100;
    ctx.fillStyle = C.white; rr(ctx,x,y,w,h,36); ctx.fill();

    // photo / initials
    const cx = x+40+95, cy = y+h/2, rad = 95;
    ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,rad,0,Math.PI*2); ctx.clip();
    if(photos[i]){
      const im = photos[i], s = Math.max(rad*2/im.width, rad*2/im.height);
      ctx.drawImage(im, cx-im.width*s/2, cy-im.height*s/2, im.width*s, im.height*s);
    }else{
      ctx.fillStyle = C.indigo; ctx.fillRect(cx-rad,cy-rad,rad*2,rad*2);
      ctx.fillStyle = C.marigold; ctx.font = `800 80px ${DISPLAY}`;
      ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(initials(p.name),cx,cy+4);
    }
    ctx.restore();
    ctx.lineWidth=8; ctx.strokeStyle=C.marigold; ctx.beginPath(); ctx.arc(cx,cy,rad,0,Math.PI*2); ctx.stroke();

    // text
    const tx = x+40+190+40, maxW = x+w-40-tx;
    ctx.textAlign="left"; ctx.textBaseline="alphabetic";
    ctx.fillStyle = C.indigo; ctx.font = `800 58px ${DISPLAY}`;
    ctx.fillText(fit(ctx,p.name,maxW), tx, y+78);
    ctx.fillStyle = C.slate; ctx.font = `400 30px ${BODY}`;
    ctx.fillText(fit(ctx,p.role,maxW), tx, y+120);
    ctx.fillStyle = C.indigo; ctx.font = `600 36px ${BODY}`;
    ctx.fillText(fit(ctx,p.phone,maxW), tx, y+176);
    ctx.font = `400 31px ${BODY}`;
    ctx.fillText(fit(ctx,p.email,maxW), tx, y+222);
    const li = (p.links.find(l=>/linkedin/i.test(l.url))||{}).url;
    if(li){
      ctx.fillStyle = C.slate; ctx.font = `400 28px ${BODY}`;
      ctx.fillText(fit(ctx,li.replace(/^https?:\/\/(www\.)?/,"").replace(/\/$/,""),maxW), tx, y+266);
    }
  });

  // meetup footer
  const m = CONFIG.meetup, d = new Date(m.start);
  const dateStr = d.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
  const timeStr = d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
  ctx.fillStyle = C.marigold; rr(ctx,50,1010,W-100,265,36); ctx.fill();
  ctx.fillStyle = C.indigo; ctx.textAlign="left";
  ctx.font = `800 54px ${DISPLAY}`;
  ctx.fillText("Next meetup", 90, 1080);
  ctx.font = `600 40px ${BODY}`;
  ctx.fillText(fit(ctx,`${dateStr}, ${timeStr}`,W-180), 90, 1145);
  ctx.font = `400 36px ${BODY}`;
  ctx.fillText(fit(ctx,m.place,W-180), 90, 1195);
  ctx.fillText(fit(ctx,m.address,W-180), 90, 1243);

  ctx.fillStyle = C.slate; ctx.font = `600 32px ${BODY}`; ctx.textAlign="center";
  ctx.fillText(CONFIG.org.website, W/2, 1320);

  return cv;
}

function renderPage(){
  document.title = `${CONFIG.org.name} ${CONFIG.org.subtitle.toLowerCase()} contact`;
  $("pageTitle").textContent = `${CONFIG.org.name} ${CONFIG.org.subtitle.toLowerCase()}`;

  $("fullName").textContent = CONFIG.org.fullName;
  $("websiteNote").textContent = CONFIG.org.website;

  const box = $("people");
  CONFIG.people.forEach(p=>{
    const wrap = document.createElement("div"); wrap.className="person";
    const h = document.createElement("h3"); h.textContent = p.name;
    const sub = document.createElement("p"); sub.textContent = p.role;
    const links = document.createElement("div"); links.className="links";
    const all = [
      { label:"Call", url:`tel:${p.phone.replace(/[^+\d]/g,"")}`, shown:p.phone },
      { label:"Email", url:`mailto:${p.email}`, shown:p.email },
      ...p.links.map(l=>({label:l.label,url:l.url,shown:""}))
    ];
    all.forEach(l=>{
      const a = document.createElement("a"); a.href=l.url;
      if(/^https?:/.test(l.url)){ a.target="_blank"; a.rel="noopener"; }
      a.textContent = l.label;
      if(l.shown){ const s=document.createElement("span"); s.textContent=l.shown; a.appendChild(s); }
      links.appendChild(a);
    });
    wrap.append(h,sub,links); box.appendChild(wrap);
  });

  const m = CONFIG.meetup, s = new Date(m.start), e = new Date(m.end);
  const mb = $("meetup");
  const line = (t,cls)=>{ const p=document.createElement("p"); if(cls)p.className=cls; p.textContent=t; mb.appendChild(p); return p; };
  line(m.title,"when");
  line(`${s.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric"})}, ${s.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"})} to ${e.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"})}`);
  line(`${m.place}, ${m.address}`);
  if(m.mapUrl){ const p=document.createElement("p"); const a=document.createElement("a"); a.href=m.mapUrl; a.target="_blank"; a.rel="noopener"; a.textContent="Open in maps"; a.style.color="inherit"; p.appendChild(a); mb.appendChild(p); }
  if(m.note) line(m.note,"note");
  if(m.office) line(m.office);

  // calendar file
  const f = d => d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+"T"+String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0")+"00";
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//ACEM//Meetup//EN","BEGIN:VEVENT",
    `UID:${f(s)}@acem`,`DTSTAMP:${f(new Date())}`,`DTSTART:${f(s)}`,`DTEND:${f(e)}`,
    `SUMMARY:${m.title}`,`LOCATION:${m.place}, ${m.address}`,"END:VEVENT","END:VCALENDAR"].join("\r\n");
  $("calBtn").href = "data:text/calendar;charset=utf-8," + encodeURIComponent(ics);
}

async function saveCard(){
  if(!cardBlob){ toast("Card is still loading"); return; }
  const file = new File([cardBlob], "acem-contact-card.png", {type:"image/png"});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:"ACEM contact card"}); return; }
    catch(e){ if(e.name==="AbortError") return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(cardBlob); a.download = "acem-contact-card.png";
  document.body.appendChild(a); a.click(); a.remove();
  toast("Card saved to your downloads");
}

(async function init(){
  renderPage();
  const cv = await drawCard();
  try{
    cardBlob = await new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(),"image/png"));
    $("cardImg").src = URL.createObjectURL(cardBlob);
  }catch(e){
    // Fallback if a photo came from another domain and tainted the canvas
    toast("Use photos from the same folder as this page");
  }
  $("saveBtn").addEventListener("click", saveCard);
})();
</script>
</body>
</html>
